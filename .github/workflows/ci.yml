name: CI - Auto Version Bump & Publish

on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  bump-and-publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: cd packages/soda && bun test

      - name: Detect changed plugins
        id: detect-plugins
        run: |
          changed_plugins=""
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            changes=$(git diff ${{ github.event.before }}..${{ github.sha }} --name-only -- "plugins/${plugin_name}/" | \
              grep -v -E "^plugins/${plugin_name}/\.claude-plugin/" || true \
            )
            if [ -n "$changes" ]; then
              changed_plugins="${changed_plugins}${plugin_name}"$'\n'
            fi
          done

          changed_plugins=$(echo "$changed_plugins" | sed '/^$/d')
          if [ -n "$changed_plugins" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "plugins<<EOF" >> "$GITHUB_OUTPUT"
            echo "$changed_plugins" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump plugin versions
        if: steps.detect-plugins.outputs.has_changes == 'true'
        id: bump
        run: |
          bumped=""
          while IFS= read -r plugin_name; do
            echo "Bumping version for: ${plugin_name}"
            result=$(bun run scripts/bump-version.ts "$plugin_name")
            echo "$result"
            bumped="${bumped}${plugin_name}, "
          done <<< "${{ steps.detect-plugins.outputs.plugins }}"
          echo "bumped=${bumped%, }" >> "$GITHUB_OUTPUT"

      - name: Detect package changes
        id: detect-package
        run: |
          changes=$(git diff ${{ github.event.before }}..${{ github.sha }} --name-only -- "packages/soda/" || true)
          if [ -n "$changes" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package version
        if: steps.detect-package.outputs.has_changes == 'true'
        run: |
          cd packages/soda
          current=$(jq -r .version package.json)
          IFS='.' read -r major minor patch <<< "$current"
          new_version="${major}.${minor}.$((patch + 1))"
          jq --arg v "$new_version" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "Bumped @whatasoda/agent-tools: ${current} → ${new_version}"

      - name: Publish to npm
        if: steps.detect-package.outputs.has_changes == 'true'
        run: cd packages/soda && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and push
        if: steps.detect-plugins.outputs.has_changes == 'true' || steps.detect-package.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .claude-plugin/marketplace.json
          git add plugins/*/.claude-plugin/plugin.json
          git add packages/soda/package.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: auto-bump and rebuild (${{ steps.bump.outputs.bumped }}) [skip ci]"
          git push
