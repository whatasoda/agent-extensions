name: CI - Auto Version Bump & Build

on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  bump-and-build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect changed plugins
        id: detect
        run: |
          changed_plugins=""
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            # Check source files only (skills, src, hooks, package.json)
            # Exclude dist/ and .claude-plugin/ (outputs, not triggers)
            changes=$(git diff ${{ github.event.before }}..${{ github.sha }} --name-only -- "plugins/${plugin_name}/" | \
              grep -v -E "^plugins/${plugin_name}/(dist|\.claude-plugin)/" || true \
            )
            if [ -n "$changes" ]; then
              changed_plugins="${changed_plugins}${plugin_name}"$'\n'
              echo "Changes detected for plugin: ${plugin_name}"
              echo "$changes"
            fi
          done

          changed_plugins=$(echo "$changed_plugins" | sed '/^$/d')
          if [ -n "$changed_plugins" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "plugins<<EOF" >> "$GITHUB_OUTPUT"
            echo "$changed_plugins" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No plugin changes detected"
          fi

      - name: Bump versions
        if: steps.detect.outputs.has_changes == 'true'
        id: bump
        run: |
          bumped=""
          while IFS= read -r plugin_name; do
            echo "Bumping version for: ${plugin_name}"
            result=$(bun run scripts/bump-version.ts "$plugin_name")
            echo "$result"
            bumped="${bumped}${plugin_name}, "
          done <<< "${{ steps.detect.outputs.plugins }}"
          echo "bumped=${bumped%, }" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.detect.outputs.has_changes == 'true'
        run: bun run build

      - name: Commit and push
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .claude-plugin/marketplace.json
          git add plugins/*/.claude-plugin/plugin.json
          git add plugins/*/dist/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: auto-bump and rebuild (${{ steps.bump.outputs.bumped }}) [skip ci]"
          git push
